[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fighi"
version = "1.1.0"
description = "Statistically controlled Fisher-information-guided interaction discovery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Ariel Ghislain Kemogne Kamdoum"}
]
keywords = ["genomics", "epistasis", "GWAS", "interactions", "Fisher information", "hypergraph"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "twine>=5"]
annotation = ["gprofiler-official>=1.0.0"]

[project.scripts]
fighi = "fighi.cli:main"

[project.urls]
Homepage = "https://github.com/1234-Ariel-code/fighi"
Documentation = "https://github.com/1234-Ariel-code/fighi/tree/main/docs"
Repository = "https://github.com/1234-Ariel-code/fighi"
Issues = "https://github.com/1234-Ariel-code/fighi/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
